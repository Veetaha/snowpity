name: docker
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      workspace:
        description: Terraform workspace to build the images for
        type: choice
        options: [default, dev]
        default: default
      release:
        description: Build in release mode
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  cancel-in-progress: true
  group: "docker-${{ github.workflow }}-${{ github.ref }}-${{ inputs.workspace }}"

jobs:
  build:
    # The production server is ARM, so the build runs natively without QEMU
    runs-on: ubuntu-24.04-arm
    env:
      TF_WORKSPACE: ${{ inputs.workspace || 'default' }}
      EVENT: ${{ github.event_name }}
      RELEASE: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@v7

      - if: github.event_name != 'pull_request'
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          flags=()
          if [[ $EVENT != workflow_dispatch || $RELEASE == true ]]; then
            flags+=(--release)
          fi
          if [[ $EVENT != pull_request ]]; then
            flags+=(--push)
          fi
          if [[ $EVENT == push ]]; then
            flags+=(--latest)
          fi
          ./x.py docker build "${flags[@]}"
