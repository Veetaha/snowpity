  { name = "parking_lot_core", version = "=0.9.12" },

  # Comes from snowpity-tg -> nanoid@0.5.0
  # Other direct parents: metrics-util@0.20.4
  { name = "rand", version = "=0.9.5" },

  # Comes from snowpity-tg -> nanoid@0.5.0
  # Direct parents: rand@0.9.5, rand_chacha@0.9.0, rand_xoshiro@0.7.0
  { name = "rand_core", version = "=0.9.5" },

  # Comes from snowpity-tg -> tracing-loki@0.2.7
  # Other direct parents: teloxide-core@0.13.0
  { name = "reqwest", version = "=0.12.28" },

  # Comes from snowpity-tg -> sqlx@0.9.0
  # Direct parents: sqlx-core@0.9.0, sqlx-macros-core@0.9.0
  { name = "sha2", version = "=0.10.9" },

  # Comes from metrics-bat -> tracing@0.1.44
  # Direct parents:
  #   aquamarine@0.6.0
  #   arg_enum_proc_macro@0.3.4
  #   darling_core@0.20.11
  #   darling_macro@0.20.11
  #   derive_more-impl@1.0.0
  #   derive_more-impl@2.1.1
  #   equator-macro@0.4.2
  #   num-derive@0.4.2
  #   num_enum_derive@0.7.6
  #   pin-project-internal@1.1.13
  #   profiling-procmacros@1.0.18
  #   prost-derive@0.13.5
  #   sea-query-derive@1.0.0
  #   sqlx-macros-core@0.9.0
  #   sqlx-macros@0.9.0
  #   strum_macros@0.28.0
  #   teloxide-macros@0.10.0
  #   test-log-core@0.2.21
  #   test-log-macros@0.2.21
  #   tracing-attributes@0.1.31
  #   zerocopy-derive@0.8.63
  { name = "syn", version = "=2.0.119" },
]

deny = [
  # Using only `rustls` relives us from linking to openssl
  { name = "native-tls" },
  { name = "openssl" },
]

[sources]
unknown-git      = "deny"
unknown-registry = "warn"

[licenses]
# run `cargo deny list` to see which crates use which license
allow = [
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Apache-2.0 WITH LLVM-exception",
  "0BSD",
  "Unlicense",
  "Apache-2.0",
  "Zlib",
  "ISC",
  # Best license ever 😂
  "WTFPL",
  "MPL-2.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]

# We want really high confidence when inferring licenses from text
confidence-threshold = 0.92

[[licenses.clarify]]
name    = "ring"
version = "0.16.15"
# Copied this expression from the comment of Jake-Shadle (maintainer of cargo-deny)
# https://github.com/EmbarkStudios/cargo-deny/issues/110#issuecomment-576173641
# The issue under ring repo:
# https://github.com/briansmith/ring/issues/902
expression    = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
# This PR intended to fix low-confidence score: https://github.com/briansmith/webpki/pull/128
# however, it is not entirely covered by ISC, but let's say it's permissive 🤯
expression    = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]
name          = "webpki"

[[licenses.clarify]]
expression    = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]
# This seems like a fork of `webpki` crate higher
name = "rustls-webpki"
