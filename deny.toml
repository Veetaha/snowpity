# Docs: https://embarkstudios.github.io/cargo-deny/checks/index.html

# We want to run `cargo deny` only for platforms we use and support
[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[advisories]
unmaintained = "workspace"
yanked       = "deny"

[bans]
# This lint issues false-positives for `{ path = "foo/bar" }` dependencies
# FIXME: make it "deny" once this bug is fixed:
# https://github.com/EmbarkStudios/cargo-deny/issues/241
wildcards = "allow"

multiple-versions = "deny"
skip = [
  # Comes from snowpity-tg -> teloxide@0.17.0
  # Direct parents: aquamarine@0.6.0
  { name = "itertools", version = "=0.10.5" },

  # Comes from snowpity-tg -> from_variants@1.0.2
  # Direct parents:
  #   darling_core@0.14.4
  #   darling_macro@0.14.4
  #   from_variants_impl@1.0.2
  { name = "syn", version = "=1.0.109" },

  # Comes from snowpity-tg -> from_variants@1.0.2
  # Direct parents: darling_core@0.14.4
  { name = "strsim", version = "=0.10.0" },

  # Comes from snowpity-tg -> from_variants@1.0.2
  # Direct parents: darling@0.14.4, darling_macro@0.14.4
  { name = "darling_core", version = "=0.14.4" },

  # Comes from snowpity-tg -> sea-query@1.0.2
  # Direct parents: sea-query-derive@1.0.0
  { name = "darling", version = "=0.20.11" },

  # Comes from snowpity-tg -> sea-query@1.0.2
  # Direct parents: darling@0.20.11, darling_macro@0.20.11
  { name = "darling_core", version = "=0.20.11" },

  # Comes from snowpity-tg -> from_variants@1.0.2
  # Direct parents: from_variants_impl@1.0.2
  { name = "darling", version = "=0.14.4" },

  # Comes from snowpity-tg -> teloxide@0.17.0
  # Other direct parents: teloxide-core@0.13.0
  { name = "derive_more", version = "=1.0.0" },

  # Comes from snowpity-tg -> from_variants@1.0.2
  # Direct parents: darling@0.14.4
  { name = "darling_macro", version = "=0.14.4" },

  # Comes from snowpity-tg -> sea-query@1.0.2
  # Direct parents: darling@0.20.11
  { name = "darling_macro", version = "=0.20.11" },

  # Comes from snowpity-tg -> teloxide@0.17.0
  # Direct parents: derive_more@1.0.0
  { name = "derive_more-impl", version = "=1.0.0" },

  # Comes from snowpity-tg -> sea-query@1.0.2
  # Direct parents: sea-query-derive@1.0.0
  { name = "heck", version = "=0.4.1" },

  # Comes from metrics-bat -> metrics-exporter-prometheus@0.18.3
  # Other direct parents: reqwest@0.12.28, sqlx-core@0.9.0, sqlx-postgres@0.9.0
  { name = "base64", version = "=0.22.1" },

  # Comes from snowpity-tg -> sqlx@0.9.0
  # Direct parents: digest@0.10.7
  { name = "block-buffer", version = "=0.10.4" },

  # Comes from snowpity-tg -> sqlx@0.9.0
  # Direct parents: sha2@0.10.9
  { name = "cpufeatures", version = "=0.2.17" },

  # Comes from snowpity-tg -> sqlx@0.9.0
  # Direct parents: digest@0.10.7
  { name = "crypto-common", version = "=0.1.6" },

  # Comes from snowpity-tg -> sqlx@0.9.0
  # Direct parents: sha2@0.10.9
  { name = "digest", version = "=0.10.7" },

  # Comes from snowpity-tg -> rustls@0.23.46
  # Direct parents: ring@0.17.14
  { name = "getrandom", version = "=0.2.17" },

  # Comes from snowpity-tg -> nanoid@0.5.0
  # Direct parents: rand_core@0.9.5
  { name = "getrandom", version = "=0.3.4" },

  # Comes from metrics-bat -> metrics-exporter-prometheus@0.18.3
  # Direct parents: hashlink@0.11.1, metrics-util@0.20.4, sqlx-core@0.9.0
  { name = "hashbrown", version = "=0.16.1" },

  # Comes from snowpity-tg -> image@0.25.10
  # Direct parents: prost-derive@0.13.5, rav1e@0.8.1
  { name = "itertools", version = "=0.14.0" },

  # Comes from snowpity-tg -> sqlx@0.9.0
  # Direct parents: futures-intrusive@0.5.0, parking_lot@0.12.5
  { name = "lock_api", version = "=0.4.14" },

  # Comes from snowpity-tg -> image@0.25.10
  # Direct parents: exr@1.74.2, png@0.18.1
  { name = "miniz_oxide", version = "=0.8.9" },

